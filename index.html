<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #2a2a2a;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }
        .connect-btn, .disconnect-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .connect-btn {
            background: #3b82f6;
            color: white;
        }
        .connect-btn:hover {
            background: #2563eb;
        }
        .disconnect-btn {
            background: #374151;
            color: #9ca3af;
        }
        .disconnect-btn:hover {
            background: #4b5563;
        }
        .scores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .score-card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }
        .score-label {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .score-value {
            font-size: 3rem;
            font-weight: 700;
        }
        .score-value.sleep { color: #8b5cf6; }
        .score-value.readiness { color: #10b981; }
        .score-value.activity { color: #f59e0b; }
        .score-value.hrv { color: #ec4899; }
        .score-subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-top: 4px;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }
        .chart-card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 24px;
        }
        .chart-title {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #ccc;
        }
        .chart-container {
            position: relative;
            height: 250px;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #666;
        }
        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }
        .auth-screen h2 {
            font-size: 2rem;
            margin-bottom: 16px;
        }
        .auth-screen p {
            color: #888;
            margin-bottom: 32px;
            max-width: 400px;
        }
        .hidden { display: none !important; }
        .date-range {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .date-range select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .chart-card {
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Health Dashboard</h1>
            <div id="headerActions">
                <button class="connect-btn" id="connectBtn" onclick="connectOura()">Connect Oura</button>
            </div>
        </header>

        <div id="authScreen" class="auth-screen">
            <h2>Connect Your Oura Ring</h2>
            <p>Link your Oura account to see your sleep, readiness, and activity data in one place.</p>
            <button class="connect-btn" onclick="connectOura()">Connect Oura Ring</button>
        </div>

        <div id="dashboard" class="hidden">
            <div class="scores-grid">
                <div class="score-card">
                    <div class="score-label">Sleep Score</div>
                    <div class="score-value sleep" id="sleepScore">--</div>
                    <div class="score-subtitle" id="sleepTime">-- hrs</div>
                </div>
                <div class="score-card">
                    <div class="score-label">Readiness</div>
                    <div class="score-value readiness" id="readinessScore">--</div>
                    <div class="score-subtitle" id="readinessMsg">--</div>
                </div>
                <div class="score-card">
                    <div class="score-label">Activity</div>
                    <div class="score-value activity" id="activityScore">--</div>
                    <div class="score-subtitle" id="activityCals">-- cal</div>
                </div>
                <div class="score-card">
                    <div class="score-label">Avg HRV</div>
                    <div class="score-value hrv" id="hrvValue">--</div>
                    <div class="score-subtitle">ms</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <div class="chart-title">Sleep Score (30 days)</div>
                    <div class="chart-container">
                        <canvas id="sleepChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Readiness Score (30 days)</div>
                    <div class="chart-container">
                        <canvas id="readinessChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Activity Score (30 days)</div>
                    <div class="chart-container">
                        <canvas id="activityChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">HRV Trend (30 days)</div>
                    <div class="chart-container">
                        <canvas id="hrvChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let charts = {};

        function getToken() {
            return localStorage.getItem('oura_token');
        }

        function connectOura() {
            window.location.href = '/api/auth';
        }

        function disconnect() {
            localStorage.removeItem('oura_token');
            localStorage.removeItem('oura_refresh_token');
            window.location.reload();
        }

        async function fetchOuraData(endpoint) {
            const token = getToken();
            if (!token) return null;

            try {
                const response = await fetch(`/api/oura-data?endpoint=${endpoint}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                return await response.json();
            } catch (error) {
                console.error(`Error fetching ${endpoint}:`, error);
                return null;
            }
        }

        function createChart(canvasId, label, data, color) {
            const ctx = document.getElementById(canvasId).getContext('2d');

            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }

            charts[canvasId] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: label,
                        data: data.values,
                        borderColor: color,
                        backgroundColor: color + '20',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 2,
                        pointHoverRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { color: '#2a2a2a' },
                            ticks: { color: '#666', maxTicksLimit: 7 }
                        },
                        y: {
                            grid: { color: '#2a2a2a' },
                            ticks: { color: '#666' },
                            min: 0,
                            max: label === 'HRV' ? undefined : 100
                        }
                    }
                }
            });
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        async function loadDashboard() {
            // Fetch all data in parallel
            const [sleepData, readinessData, activityData] = await Promise.all([
                fetchOuraData('daily_sleep'),
                fetchOuraData('daily_readiness'),
                fetchOuraData('daily_activity')
            ]);

            // Update today's scores
            if (sleepData?.data?.length) {
                const latest = sleepData.data[sleepData.data.length - 1];
                document.getElementById('sleepScore').textContent = latest.score || '--';
                if (latest.contributors?.total_sleep) {
                    const hours = (latest.contributors.total_sleep / 3600).toFixed(1);
                    document.getElementById('sleepTime').textContent = `${hours} hrs`;
                }

                // Sleep chart
                createChart('sleepChart', 'Sleep', {
                    labels: sleepData.data.map(d => formatDate(d.day)),
                    values: sleepData.data.map(d => d.score)
                }, '#8b5cf6');
            }

            if (readinessData?.data?.length) {
                const latest = readinessData.data[readinessData.data.length - 1];
                document.getElementById('readinessScore').textContent = latest.score || '--';

                // HRV from readiness
                if (latest.contributors?.hrv_balance !== undefined) {
                    document.getElementById('hrvValue').textContent = Math.round(latest.contributors.hrv_balance) || '--';
                }

                const score = latest.score;
                let msg = 'Pay attention';
                if (score >= 85) msg = 'Optimal';
                else if (score >= 70) msg = 'Good';
                document.getElementById('readinessMsg').textContent = msg;

                // Readiness chart
                createChart('readinessChart', 'Readiness', {
                    labels: readinessData.data.map(d => formatDate(d.day)),
                    values: readinessData.data.map(d => d.score)
                }, '#10b981');

                // HRV chart (from readiness contributors)
                const hrvData = readinessData.data.filter(d => d.contributors?.hrv_balance);
                if (hrvData.length) {
                    createChart('hrvChart', 'HRV', {
                        labels: hrvData.map(d => formatDate(d.day)),
                        values: hrvData.map(d => d.contributors.hrv_balance)
                    }, '#ec4899');
                }
            }

            if (activityData?.data?.length) {
                const latest = activityData.data[activityData.data.length - 1];
                document.getElementById('activityScore').textContent = latest.score || '--';
                document.getElementById('activityCals').textContent = `${latest.active_calories || 0} cal`;

                // Activity chart
                createChart('activityChart', 'Activity', {
                    labels: activityData.data.map(d => formatDate(d.day)),
                    values: activityData.data.map(d => d.score)
                }, '#f59e0b');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const token = getToken();

            if (token) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('connectBtn').textContent = 'Disconnect';
                document.getElementById('connectBtn').className = 'disconnect-btn';
                document.getElementById('connectBtn').onclick = disconnect;
                loadDashboard();
            }
        });
    </script>
</body>
</html>
